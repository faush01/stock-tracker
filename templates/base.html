<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        body { padding-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="mb-4 d-flex align-items-center gap-3">
            <a class="text-decoration-none fw-bold fs-4" href="/">Stock Tracker</a>
            <a class="btn btn-sm btn-outline-secondary" href="/">Watchlist</a>
            <a class="btn btn-sm btn-outline-secondary" href="/portfolio">Portfolio</a>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
